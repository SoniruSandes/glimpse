[package]
name = "quicklook"
version = "0.8.0"
edition = "2021"
description = "Quick File preview (Peek-View) for Windows and Linux"

[[bin]]
name = "quicklook"
path = "src/main.rs"

[features]
# RAR needs the unrar C++ library (built from source by the `unrar` crate; needs a C++ compiler).
# If it gives trouble: cargo build --release --no-default-features
default = ["rar"]
rar = ["dep:unrar"]

[dependencies]
tray-icon = "0.19"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.29", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga"] }
calamine = "0.31"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
sevenz-rust = "0.6"
unrar = { version = "0.5", optional = true }
libloading = "0.8"
psd = "0.3"
resvg = "0.45"
open = "5"
pelite = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
# 3D models: OBJ via tobj, glTF/GLB via gltf (base-colour textures only, no C code). STL and PLY have small built-in parsers.
tobj = "4"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
# Optional texture picker for 3D models (native file / folder dialog). Linux uses the desktop portal (no GTK needed).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# EXE icon + version info (build.rs, app.rc). Only needed when the build machine runs Windows.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

# ---------------- Windows only ----------------
[target.'cfg(windows)'.dependencies]
# Pinned: windows-rs changes signatures between releases.
windows = { version = "=0.58.0", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"
wry = "0.55"
raw-window-handle = "0.6"

# ---------------- everything except Windows ----------------
[target.'cfg(not(windows))'.dependencies]
# PDF: loads libpdfium at run time (ship it next to the executable; CI does this).
pdfium-render = "0.8"

# ---------------- Linux only ----------------
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"   # the tray icon needs a GTK main loop
zbus = "4"     # GNOME Files (Nautilus) calls our previewer over D-Bus when you press Space

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic stays "unwind": a decoder crash on one bad file is caught instead of killing the window.
